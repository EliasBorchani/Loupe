name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux, not macOS: nothing here opens a window. The state holder is tested without Compose
    # and the parsers are plain Kotlin, so the only thing that genuinely needs a Mac is
    # packageDmg — which is a release step, not a per-push one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      # The build is expected to be warning-free; a deprecation is a small task now and a
      # migration later, so it fails here rather than accumulating.
      - name: Fail on compiler warnings
        run: |
          ./gradlew clean compileKotlin compileTestKotlin 2>&1 | tee build.log
          if grep -q '^w:' build.log; then
            echo "::error::Kotlin emitted warnings:"
            grep '^w:' build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
