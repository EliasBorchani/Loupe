# GitLab CI for a self-hosted instance: Docker runners for build and test, a Mac mini shell runner
# for packaging. The packaging steps live in tools/package-dmg.sh, which the GitHub workflow calls
# too — two CI files that each spell out the packaging drift, and the one nobody watches is the one
# that breaks on release day.
#
# Runner tags below are placeholders. Set them to whatever yours advertise.

stages:
  - build
  - package
  - release

# One pipeline per change. Without this, pushing a branch that has an open merge request runs both a
# branch pipeline and a merge-request pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build and test: Docker ────────────────────────────────────────────────────────────────────
#
# On Docker rather than the Mac minis, deliberately. This job runs on every push and merge request,
# and the Macs are the scarce resource — they should be free for the thing that genuinely needs
# them. Nothing here opens a window: the state holder is tested without Compose and the parsers are
# plain Kotlin, so Linux is enough. Only jpackage needs macOS.
build:
  stage: build
  # -jammy, not the floating `17-jdk`: that tag follows the base distribution and will step to a
  # new Ubuntu under you, taking glibc with it — which is what Skiko's Linux native links against.
  # The JDK patch level floating is fine and desirable; the distro moving is not.
  #
  # If this instance pulls from Docker Hub anonymously, mirror the image into the GitLab container
  # registry: the rate limit is per IP, and every runner behind the same NAT shares it.
  image: eclipse-temurin:17-jdk-jammy
  tags:
    - docker-only
  variables:
    # Inside the project directory, because GitLab can only cache paths it can see from there.
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: "gradle-$CI_DEFAULT_BRANCH"
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew build --stacktrace
  artifacts:
    when: always
    expire_in: 1 week
    # Renders failures in the merge request itself rather than in a log nobody opens.
    reports:
      junit:
        - core/build/test-results/test/TEST-*.xml
        - desktop/build/test-results/test/TEST-*.xml
    paths:
      - "*/build/reports/tests"

# ── Packaging: the Mac mini, shell executor ───────────────────────────────────────────────────
#
# A shell executor is not an isolated container, and three things follow from that:
#
#   - **No `image:`, and no GRADLE_USER_HOME override.** The runner's own ~/.gradle persists between
#     builds, which is faster than GitLab's cache could ever be — it zips and unzips. It is also
#     where the signing credentials live, if this machine has them.
#   - **The working directory survives**, so tools/package-dmg.sh empties build/release before
#     writing. Otherwise the previous tag's .dmg is still sitting there when the release job globs
#     the folder.
#   - **The Gradle daemon survives too**, and that is a feature here. No --no-daemon.
#
# The Mac only needs *a* JDK 17+ on PATH for Gradle itself to start. Which one does not matter:
# jvmToolchain and the foojay resolver provision an Adoptium 17 for compiling and for jpackage, so
# even a Homebrew JDK on the runner produces a correct bundle.
.macos:
  tags:
    - no-docker
  timeout: 45m

package:dmg:
  extends: .macos
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - ./gradlew build
    # Signs and notarises if this machine has a Developer ID identity in ~/.gradle/gradle.properties,
    # builds unsigned otherwise. See docs/packaging.md.
    - DMG=$(./tools/package-dmg.sh "${CI_COMMIT_TAG#v}")
    # The upload happens here, not in the release job: that one runs the release-cli image, which is
    # Alpine-based and ships no curl. macOS has curl built in.
    - |
      set -e
      for file in build/release/*; do
        name=$(basename "$file")
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/loupe/${CI_COMMIT_TAG#v}/${name}"
        echo "uploaded $name"
      done
    # Handed to the release job as variables. The `release:` block expands `$VAR` but *not* shell
    # parameter expansion, so `${CI_COMMIT_TAG#v}` there would be taken literally and the asset link
    # would point at a version that was never uploaded.
    - |
      {
        echo "PKG_VERSION=${CI_COMMIT_TAG#v}"
        echo "DMG_NAME=$(basename "$DMG")"
      } > build/release/release.env
  artifacts:
    expire_in: 30 days
    reports:
      dotenv: build/release/release.env
    paths:
      - build/release/

# ── Release ───────────────────────────────────────────────────────────────────────────────────
release:
  stage: release
  # This image exists to provide release-cli and nothing else — it is Alpine with one binary, no
  # curl, no bash. Anything that needs a tool belongs in package:dmg.
  #
  # Pin this to a version your instance supports rather than tracking `latest`, and mirror it into
  # your own registry if the runners cannot reach registry.gitlab.com.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker-only
  needs:
    # artifacts: true is what carries release.env's variables across, not just the files.
    - job: package:dmg
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Releasing $CI_COMMIT_TAG with $DMG_NAME"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Loupe $CI_COMMIT_TAG"
    description: |
      Built on Apple Silicon. An Intel Mac needs its own build: Skiko ships one native library per
      architecture and there is no universal binary.

      If the build is not notarised, macOS refuses it on the first try — right-click the app →
      **Open** → **Open**, once, or `xattr -d com.apple.quarantine /Applications/Loupe.app`.

      Verify the download against the `.sha256` beside it.
    assets:
      links:
        # $DMG_NAME and $PKG_VERSION come from package:dmg's dotenv report. Plain variables, because
        # this block does no shell expansion.
        - name: "$DMG_NAME"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/loupe/$PKG_VERSION/$DMG_NAME"
          link_type: package
