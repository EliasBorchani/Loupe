# GitLab CI, doing the same work as .github/workflows/. The packaging steps live in
# tools/package-dmg.sh so the two cannot drift — the CI file nobody watches is the one that breaks
# on release day.

stages:
  - build
  - package
  - release

# One pipeline per change, not two. Without this, pushing a branch that has an open merge request
# runs both a branch pipeline and a merge-request pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.linux:
  image: eclipse-temurin:17-jdk
  variables:
    # Inside the project directory, because GitLab can only cache paths it can see from there.
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: "gradle-$CI_DEFAULT_BRANCH"
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x gradlew

build:
  extends: .linux
  stage: build
  # Linux, because nothing here opens a window: the state holder is tested without Compose and the
  # parsers are plain Kotlin. Only packaging needs a Mac.
  script:
    - ./gradlew build --stacktrace
  artifacts:
    when: always
    expire_in: 1 week
    # Surfaces failures in the merge request itself rather than in a log nobody opens.
    reports:
      junit:
        - core/build/test-results/test/TEST-*.xml
        - desktop/build/test-results/test/TEST-*.xml
    paths:
      - "*/build/reports/tests"

# Needs a macOS runner: jpackage cannot produce a .dmg anywhere else. On GitLab.com that means SaaS
# macOS runners, which are a paid tier — on the free tier this job simply stays pending, and the
# honest fallback is `tools/package-dmg.sh` on your own Mac (see docs/packaging.md).
#
# Swap the tag below for whatever your runner advertises: `saas-macos-medium-m1` on GitLab.com, or
# your own tag for a self-hosted Mac.
.macos:
  tags:
    - saas-macos-medium-m1
  timeout: 45m

package:dmg:
  extends: .macos
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - ./gradlew build
    - ./tools/package-dmg.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    expire_in: 30 days
    paths:
      - build/release/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:dmg
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    VERSION: "${CI_COMMIT_TAG}"
  script:
    # A GitLab release links to assets, it does not host them, so the files go to the project's
    # generic package registry first.
    - |
      for file in build/release/*; do
        name=$(basename "$file")
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/loupe/${CI_COMMIT_TAG#v}/${name}"
        echo "uploaded $name"
      done
    - |
      cat > assets.json <<JSON
      [$(for file in build/release/*.dmg; do
            name=$(basename "$file")
            printf '{"name":"%s","url":"%s/packages/generic/loupe/%s/%s","link_type":"package"},' \
              "$name" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}" "${CI_COMMIT_TAG#v}" "$name"
         done | sed 's/,$//')]
      JSON
    - cat assets.json
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Loupe $CI_COMMIT_TAG"
    description: |
      `arm64` for Apple Silicon, `x64` for Intel. There is no universal build: Skiko ships one
      native library per architecture.

      **Not notarised.** macOS will refuse to open it on the first try. Right-click the app →
      **Open** → **Open**, once. Or `xattr -d com.apple.quarantine /Applications/Loupe.app`.

      Verify the download against the `.sha256` beside it.
    assets:
      links:
        - name: "Loupe.dmg"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/loupe/${CI_COMMIT_TAG}/"
          link_type: package
