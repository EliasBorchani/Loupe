[versions]
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
ktoml = "0.7.0"
compose = "1.11.1"
jupiter = "6.1.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
# The only genuinely third-party dependency in core. Pure Kotlin and multiplatform, so it does not
# close the door on Compose Multiplatform's native targets the way an ANTLR-based Java parser would.
ktoml-core = { module = "com.akuleshov7:ktoml-core", version.ref = "ktoml" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler plugin ships with Kotlin and must track its version exactly.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
