// Types the Compose compiler cannot judge, and why each is safe to call stable.
//
// Measured, not assumed: `composeCompiler { reportsDestination }` lists every unstable parameter,
// and this file is the difference between two of those reports. Re-run it before adding a line.

// :core has no Compose dependency, deliberately — the engine must not know what a pixel is. So the
// compiler cannot see that an index, a profile or an open source is written once and then only read.
// Nothing in dev.loupe.core mutates after construction except the parser sinks, which never cross
// into a composable.
dev.loupe.core.**

// Holds an IntArray of match positions. Structural equality would compare up to nine million ints on
// every recomposition; identity equality is both correct and free, because a new result set is a new
// instance by construction. LoupeState.Results says so in its KDoc — this is what makes the compiler
// act on it.
dev.loupe.desktop.state.Results

// The state holder itself: one instance for the window's lifetime, exposing StateFlows. Its identity
// never changes, so comparing it is meaningless rather than merely expensive.
dev.loupe.desktop.state.LoupeState

// Immutable, but does not carry the annotation that would say so. Reached the UI as
// `contextAround`'s return value.
kotlin.ranges.IntRange
